name: auto-approve-doc-changes
version: "1.0"
description: >
  Auto-approve git commits when every changed file is documentation, tests pass, and the
  diff stays under 500 lines. Targets Gate 2 (Creating a Git Commit).

  Previously expressed "documentation-only" as `diffType: docs-only`. That field declared an
  open set of values and was removed in L2.20 — `filePaths.allMatch` says the same thing
  precisely, against paths the executor actually records.
enabled: true

matcher:
  gate: git-commit

condition:
  filePaths:
    allMatch: "{docs/**,**/*.md,**/*.mdx}"
  testsPass: true
  diffLines:
    lessThan: 500

action:
  type: auto-approve
  reason: >
    Every changed file is documentation, tests pass, and the diff is under 500 lines.
    Doc-only diffs carry no behavioural risk.
