version: "1.0"

# Hook: on-retrospective-written
# Declares that learning-engine should run whenever a feature retrospective is written to
# docs/features/. Opt-in AOS Phase 3 hook.
#
# `enabled: true` does NOT activate this on its own. loom ships no hook dispatcher — see
# shared/hooks/README.md: "Nothing dispatches hooks today; the executor for them is roadmap
# L3.10." This file declares the intent for a runner you supply. Teams that wire nothing see
# zero behavior change, which is also what teams that only flip `enabled` see.

hooks:
  - id: "learning-engine-on-retrospective"
    event: "on-retrospective-written"
    enabled: false
    description: >
      After a retrospective lands in docs/features/<name>/retrospective.md, invoke the learning-engine
      skill to scan it (and prior retrospectives) for patterns worth promoting to docs/lessons-learned/.
      The engine produces a draft proposal — it never writes to lessons-learned/ without explicit human
      confirmation ("approve" or "yes").
    action:
      type: "skill"
      target: "learning-engine"
      args:
        passContext: true
        scope: "latest"          # "latest" = scan only the just-written retrospective; "all" = full sweep
        draftOnly: true          # never persist without human confirmation (non-negotiable)
    guardrails:
      - "learning-engine must pause for human confirmation before writing to docs/lessons-learned/"
      - "If the skill is not found, log a warning and skip — do not block the retrospective write"
      - "draftOnly: true is non-negotiable and must not be overridden by args or policy"
