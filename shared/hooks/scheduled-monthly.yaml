version: "1.0"

# Hook: scheduled-monthly
# Opt-in monthly schedule for maintenance skills. Copy to .claude/hooks/ and configure a cron
# runner (e.g., GitHub Actions schedule, CronCreate, or the /schedule skill) to invoke this.
# Default: all targets disabled. Enable individually per project need.
# AOS Phase 3 (v3.2).

hooks:
  - id: "forgetting-engine-monthly"
    event: "scheduled-monthly"
    enabled: false
    description: >
      Monthly staleness sweep: invokes forgetting-engine to scan shared/knowledge/ and
      docs/lessons-learned/ for items that have not been referenced in 6+ months and have
      no recent linking in the corpus. Produces a draft expiration proposal — never archives
      without explicit human confirmation ("approve expiration" or "confirm").
    schedule:
      # cron expression: first day of every month at 09:00 UTC
      # Platforms: GitHub Actions (schedule.cron), CronCreate skill, /schedule skill
      cron: "0 9 1 * *"
    action:
      type: "skill"
      target: "forgetting-engine"
      args:
        passContext: false
        stalenessThresholdMonths: 6   # flag items not referenced in 6+ months
        draftOnly: true               # never archive without human approval (non-negotiable)
    guardrails:
      - "forgetting-engine must pause for human confirmation before archiving any file"
      - "If the skill is not found, log a warning and skip — do not fail the schedule"
      - "draftOnly: true is non-negotiable and must not be overridden by args or policy"

  - id: "memory-auditor-monthly"
    event: "scheduled-monthly"
    enabled: false
    description: >
      Monthly KI corpus health audit: invokes memory-auditor to check schema compliance,
      detect duplicates, and flag stale KIs. Read-only — produces audit findings for human
      review; never mutates files.
    schedule:
      cron: "0 9 1 * *"
    action:
      type: "agent"
      target: "memory-auditor"
      args:
        passContext: false
        scope: "full"
    guardrails:
      - "memory-auditor is read-only — it never modifies files"
      - "Audit findings go to .claude/feature-workspace/memory-audit-report.md for human review"

  - id: "exemplar-auditor-monthly"
    event: "scheduled-monthly"
    enabled: false
    description: >
      Monthly exemplar audit: invokes exemplar-auditor to check every entry in
      .claude/exemplars.yaml against shared/contracts/exemplar-contract.md — that the test still
      exists and runs, still carries its annotations, and still demonstrates what the manifest
      claims. Read-only; produces findings for human review.

      This is the only thing that notices a degraded exemplar. Exemplars are deliberately NOT
      gated (roadmap L3.46, measured), so nothing stops an agent editing one, and a stale
      exemplar is worse than none — it is a few-shot prompt delivered through the filesystem, and
      every test written after it drifts inherits the drift. The digest warning in health-check
      says an exemplar's FILE changed; this says whether the exemplar still holds.
    schedule:
      cron: "0 9 1 * *"
    action:
      type: "agent"
      target: "exemplar-auditor"
      args:
        passContext: false
        # Dated, not overwritten: a scheduled audit whose output is replaced each run cannot be
        # told stale from fresh, and health-check warns on the date in this filename.
        output: "docs/audits/exemplar-audit-YYYY-MM-DD.md"
    guardrails:
      - "exemplar-auditor is read-only — it never modifies a test, the manifest, or any source"
      - "Retiring or replacing an exemplar is a human decision; the audit only reports"
      - "A project with no .claude/exemplars.yaml is a legitimate state — report and skip, never fail"
      - "If the agent is not found, log a warning and skip — do not fail the schedule"
