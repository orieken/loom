# Delivery policy (.claude/delivery-policy.yaml)
#
# Every key is optional; an absent file means all defaults. `loom run` validates
# this file strictly and refuses to start on an unknown or removed key.
#
# This file does not automate anything. Since ADR-010 (decision 4B), automation
# lives only in .claude/policies/*.policy.yaml: `loom run` evaluates those at each
# gate and records every decision. The markdown pipeline (/deliver-feature)
# always stops for a human. The old `mode`, `autoProceed*`, `gates`, `stages`,
# `escalations` and `defaults` keys are gone — see docs/MIGRATION.md.

# Kill switch for policy evaluation under `loom run`. Only an explicit `false`
# turns it off.
policiesEnabled: true

# How many times the markdown pipeline re-runs an agent whose artifact fails its
# contract check (validate-artifact) before asking a human. Default 3.
maxContractRetries: 3

# /orchestrate only (to be retired — review item D-7). Set to false to skip the
# audit-after-producer step in workflow stages.
# workflowAuditsEnabled: true

# /orchestrate only. "runtime" opts the feature-delivery workflow into the
# orchestration runtime. Leave unset to keep /deliver-feature unchanged.
# orchestrationMode: runtime
