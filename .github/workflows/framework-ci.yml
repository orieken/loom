name: Framework CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default for every job; jobs restate it explicitly per iac-conventions.md.
# All actions are pinned to full commit SHAs (same pins as loom-release.yml
# where the action overlaps) — never mutable tags.
permissions:
  contents: read

jobs:
  check-parity:
    name: Config parity (shared/ vs. generated configs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 — same pin as loom-release.yml
      - name: Install PyYAML (needed by the .roomodes validation; don't rely on runner preinstall)
        run: python3 -m pip install --quiet pyyaml
      - name: Run check-parity.sh
        run: bash scripts/check-parity.sh
      # Parity only checks that each generated file mentions the core concepts. This regenerates
      # into a temp dir and compares bytes, so a hand-edit or an unregenerated shared/ change fails
      # (roadmap C.1). Lives in this job because it guards the same files; it needs only python3.
      - name: Run check-generated-drift.sh
        run: bash scripts/check-generated-drift.sh

  test-agents:
    name: Agent golden-file tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 — same pin as loom-release.yml
      - name: Run test-agents.sh
        run: bash scripts/test-agents.sh
        # Agent invocation itself can't run in CI (no LLM call available here) — this
        # validates committed actual-output.md baselines against expected patterns and
        # contracts. Since M0.2, every fixture listed in tests/agents/fixture-manifest.txt
        # must exist (missing = FAIL, exit 1); SKIP remains only for agents that have
        # never had a baseline committed. See tests/agents/README.md.

  health-check:
    name: Framework health check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 — same pin as loom-release.yml
      # Both, and the set must match scripts/ci-check.sh's apt install or that
      # script stops being a parity check. pyyaml: health-check shells out to
      # check-parity.sh's .roomodes validation. jsonschema: health-check's own
      # frontmatter validation against the committed schemas, which is opt-in
      # and SKIPS WITH A WARNING when the import is missing — so its absence
      # showed up as three checks quietly not running, never as a failure.
      - name: Install PyYAML and jsonschema (health-check needs both)
        run: python3 -m pip install --quiet pyyaml jsonschema
      - name: Run health-check.sh
        run: bash scripts/health-check.sh --verbose

  test-install:
    name: Install verification matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 — same pin as loom-release.yml
      - name: Run test-install.sh
        run: bash scripts/test-install.sh
        # Runs a real `install.sh --project <scratch-dir> --platform <name>` for all 6 platforms and
        # asserts the expected symlinks/files exist and resolve correctly. Writes to runner-local /tmp,
        # not the checked-out repo, so it's safe to run alongside the other jobs. See Epic 32 in
        # docs/features/context-engineering-framework/TODO.md for why this exists.

  agent-versions:
    name: Agent version bump + changelog check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 — same pin as loom-release.yml
        with:
          fetch-depth: 0
      - name: Run check-agent-versions-ci.sh
        run: |
          git fetch origin "${{ github.base_ref }}"
          bash scripts/check-agent-versions-ci.sh "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"

  agent-eval-regression:
    name: Agent prompt regression (opt-in)
    runs-on: ubuntu-latest
    # Skips cleanly on forks and PRs without a key — same pattern as commit 6c422cb.
    # The script itself also guards with SKIP when ANTHROPIC_API_KEY is absent,
    # so this if: condition is belt-and-suspenders.
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.AGENT_EVAL_ENABLED == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 — same pin as loom-release.yml
      - name: Install claude CLI
        run: |
          # Install the claude CLI so run-agent-evals.sh can invoke claude --bare -p.
          # Requires Node.js (available on ubuntu-latest).
          npm install -g @anthropic-ai/claude-code
      - name: Run agent eval regression sweep
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          bash scripts/run-agent-evals.sh --no-judge
        # --no-judge skips the Haiku rubric pass in CI to control cost (~$2.05 vs $2.10).
        # Remove --no-judge to enable full rubric grading in CI if desired.
        # Set repository variable AGENT_EVAL_ENABLED=true to opt in.
        # Set repository secret ANTHROPIC_API_KEY to authenticate.

  go-build:
    name: Go build + tests + coverage (loom module and embedding example)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 — same pin as loom-release.yml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5 — same pin as loom-release.yml
        with:
          go-version-file: go.mod
      - name: Build and test the loom module
        id: gotest
        run: |
          go build ./...
          go test ./... -coverprofile=coverage.out
      - name: Coverage ratchet
        # if: always() is the fix for roadmap L3.45's second defect. Steps in a
        # job fail-fast, so when the test step above failed this one silently
        # never ran — and the number it guards drifted 1.6% over twelve days
        # with nothing reporting that it had stopped being measured. A gate
        # downstream of a failing gate reports nothing, which is the same shape
        # as a span that stops being emitted turning every assertion about it
        # green.
        #
        # It always REPORTS and conditionally GATES: `go test` writes
        # coverage.out even when tests fail, so the number is always available,
        # but coverage measured across a failing run is not comparable to a
        # clean one and failing the build on it would be noise on top of a
        # failure that already has a cause.
        if: always()
        # Ratchet policy (roadmap M0.2): the floor is the honest measured combined
        # statement coverage of the loom module — NOT the aspirational 85% from
        # CLAUDE.md. CI fails below the floor. When real coverage rises, raise
        # COVERAGE_FLOOR to the new measured value in this step. Target remains 85%.
        #
        # History, because this number's movements are the interesting part:
        #   2026-09-02  66.4  measured, set as the floor
        #   2026-09-14  65.5  RE-BASELINED DOWN by a human decision, after
        #                     coverage drifted to 64.7 unseen — from 2026-09-10
        #                     the test step failed first (the stage-timeout bug
        #                     fixed in ca8b9b2) so this step never ran at all
        #   2026-09-14  66.3  climbed back (L3.45), floor raised again
        #
        # The floor takes the LOWER of the local and CI measurements, so a small
        # environment difference cannot flap the gate: 66.3 local, ~66.5 in CI.
        #
        # Raising it is routine. Lowering it is a human decision, and the only
        # one so far is recorded above.
        env:
          COVERAGE_FLOOR: "66.3"
        run: |
          if [[ ! -f coverage.out ]]; then
            echo "NOT MEASURED: the test step produced no coverage profile"
            exit 0
          fi
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/, "", $3); print $3}')
          echo "combined statement coverage: ${total}% (floor: ${COVERAGE_FLOOR}%)"
          if [[ "${{ steps.gotest.outcome }}" != "success" ]]; then
            echo "NOT GATED: tests failed, so this number is not comparable to a clean run."
            echo "Reported so it cannot drift unmeasured while the suite is red."
            exit 0
          fi
          awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN { exit (t + 0 < f + 0) ? 1 : 0 }' \
            || { echo "FAIL: coverage ${total}% is below the ratchet floor ${COVERAGE_FLOOR}%"; exit 1; }
      - name: Build the out-of-repo embedding example (D.2)
        # Independent of the test run: it compiles a separate module against the
        # public API. It was skipped for twelve days for no reason beyond step
        # ordering, which is how a stale go.mod there went unnoticed (d23e5cd).
        if: always()
        # Own go.mod + replace — proves a consumer can register a custom tool
        # against the public tools package without loom internals or mcp-go
        # types leaking into its signatures.
        run: |
          cd examples/embedding
          go build ./...

  golangci-lint:
    name: golangci-lint (complexity gate — this IS the build gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 — same pin as loom-release.yml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5 — same pin as loom-release.yml
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned linter version: v2 config schema (.golangci.yml at the repo
          # root, gocyclo min-complexity 7 — enforces the framework-wide < 7
          # rule), runs under the go1.27 toolchain from go.mod.
          version: v2.13.2
